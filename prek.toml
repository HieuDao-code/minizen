minimum_prek_version = "0.4.8"

[update]
cooldown_days = 7

# ruff
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "f12be1ebaa5351c1fc76472de98db2c3446c8253"                          # frozen: v0.16.10
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

# uv
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "5403c16080c62d2568b9adab14249214641a9d1a"    # frozen: 0.12.21
hooks = [{ id = "uv-audit" }, { id = "uv-lock" }]

# zizmor
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"             # frozen: v1.30.1
hooks = [{ id = "zizmor", args = ["--persona", "auditor"] }]

# commitizen
[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce"        # frozen: v4.19.0
hooks = [{ id = "commitizen", stages = ["pre-push"] }]

# ty
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "6972e4c5a7e9f45f05a2f30b668f221f43b770c9"        # frozen: v0.0.84
hooks = [{ id = "ty" }]
