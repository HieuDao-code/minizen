[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "minizen"
version = "0.6.2"
description = "A quieter way to stay informed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
  { name = "Hieu Dao", email = "106801182+HieuDao-code@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "miniflux>=1.1.6,<2.0.0",
  "mistune>=3.3.3,<4.0.0",
  "pydantic>=2.13.4,<3.0.0",
  "pydantic-ai-slim[anthropic,openai]>=2.33.0,<3.0.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "tenacity>=9.1.4,<10.0.0",
  "tomli-w>=1.2.0,<2.0.0",
  "typer>=0.27.0,<0.28.0",
]

[project.urls]
Homepage = "https://github.com/hieudao-code/minizen"
Documentation = "https://hieudao-code.github.io/minizen/"
Repository = "https://github.com/hieudao-code/minizen"
Issues = "https://github.com/hieudao-code/minizen/issues"
Changelog = "https://github.com/hieudao-code/minizen/releases"

[project.scripts]
minizen = "minizen.main:app"
mz = "minizen.main:app"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "miscellaneous" },
  { include-group = "release" },
  { include-group = "security" },
  { include-group = "test" },
  { include-group = "typing" },
]
docs = ["zensical==0.0.51"]
lint = ["ruff==0.15.22"]
miscellaneous = ["prek==0.4.10"]
release = ["commitizen==4.16.5"]
security = ["zizmor==1.26.1"]
test = [
  "freezegun==1.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
]
typing = ["ty==0.0.60"]

[tool.uv]
exclude-newer = "1 week"
# Opt these out of the freshness quarantine: pydantic-ai 2.33.0 requires
# anthropic>=1.0.0, and both were published inside the 1-week window.
exclude-newer-package = { anthropic = "2026-08-22", openai = "2026-08-22", pydantic-ai-slim = "2026-08-22", pydantic-graph = "2026-08-22" }

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
breaking_change_exclamation_in_title = true
version_files = ["src/minizen/__init__.py"]
major_version_zero = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "B904",   # raise-without-from-inside-except
  "COM812", # missing-trailing-comma
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "D",       # pydocstyle
  "PLR2004", # magic-value-comparison
  "PLR0913", # too-many-arguments
  "S101",    # assert
  "S105",    # hardcoded-password-string
  "S106",    # hardcoded-password-func-arg
]
"src/minizen/ai/agent.py" = [
  "PLR0913", # too-many-arguments
]
"src/minizen/cli/**" = [
  "FBT002",  # boolean-default-value-positional-argument
  "PLR0913", # too-many-arguments
  "TC003",   # typing-only-standard-library-import
]
"src/minizen/providers/email/template.py" = [
  "E501", # line-too-long
]

[tool.ruff.lint.isort]
known-first-party = ["minizen"]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
source = ["minizen"]
omit = ["*/minizen/main.py"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.tox]
env_list = ["py314", "commit-msg", "lint", "security", "typing"]

[tool.tox.env_run_base]
description = "Run tests"
dependency_groups = ["dev"]
commands = [["pytest"]]

[tool.tox.env.commit-msg]
description = "Run commitizen checks"
skip_install = true
dependency_groups = ["release"]
commands = [["cz", "check", "--rev-range", "origin/main..HEAD"]]

[tool.tox.env.lint]
description = "Run linters"
skip_install = true
dependency_groups = ["lint"]
commands = [["ruff", "check"], ["ruff", "format", "--check"]]

[tool.tox.env.security]
description = "Run security checks"
skip_install = true
dependency_groups = ["security"]
commands = [["uv", "audit"], ["zizmor", '.', "--persona", "auditor"]]

[tool.tox.env.typing]
description = "Run type checks"
dependency_groups = ["test", "typing"]
commands = [["ty", "check"]]
