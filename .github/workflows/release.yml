name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  bump-version:
    name: "Bump version and create changelog with commitizen"
    runs-on: ubuntu-latest

    if: "!startsWith(github.event.head_commit.message, 'bump:')"

    permissions:
      contents: write # needed to push version bump commit and create release

    environment: bump-version

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Get commitizen version
        id: cz-version
        run: |
          version=$(grep -A1 'name = "commitizen"' uv.lock | grep -oP '(?<=version = ")[\d.]+')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          changelog_increment_filename: body.md
          commitizen_version: ${{ steps.cz-version.outputs.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: 0.13.1

      - name: Export runtime constraints
        run: |
          uv export --locked --no-dev --no-emit-project --no-header \
            --format requirements-txt -o constraints.txt

      - name: Release
        run: |
          gh release create "${REVISION}" \
            --notes-file body.md \
            constraints.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ env.REVISION }}
