name: Daily Digest

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC every day
  workflow_dispatch:      # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  send-digest:
    name: Send Daily Digest
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: digest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Write config file
        env:
          MINIFLUX_URL: ${{ secrets.MINIFLUX_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_TOP_N: ${{ vars.AI_TOP_N }}
        run: |
          uv run python -c "
          import os, tomli_w
          from pathlib import Path
          cfg = {
              'miniflux': {'url': os.environ['MINIFLUX_URL']},
              'email': {
                  'smtp_host': os.environ['SMTP_HOST'],
                  'smtp_port': int(os.environ['SMTP_PORT']),
                  'from_addr': os.environ['EMAIL_FROM'],
                  'to_addr': os.environ['EMAIL_TO'],
              },
              'ai': {
                  'model': os.environ.get('AI_MODEL', 'anthropic:claude-sonnet-4-6'),
                  'top_n': int(os.environ.get('AI_TOP_N', '5')),
              },
          }
          p = Path('~/.config/minizen').expanduser()
          p.mkdir(parents=True, exist_ok=True)
          (p / 'config.toml').write_bytes(tomli_w.dumps(cfg).encode())
          "

      - name: Run digest
        env:
          MINIFLUX_API_KEY: ${{ secrets.MINIFLUX_API_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: uv run minizen run
